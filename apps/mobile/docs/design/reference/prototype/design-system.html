<p style="margin: 0; font-size: 20px; line-height: 1.45; color: var(--ink-muted); max-width: 720px">The design system for a calm, timeline-first life planner. Built on Tailwind CSS v4 with one set of semantic tokens that flips between light and dark.</p>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 14px; color: var(--ink-muted)">
<span class="dk-tag">v1.1 · refined · November 2026</span>
<span>Tokens file: <span style="font-weight: 700; color: var(--ink)">daycraft-tailwind.css</span></span>
<span>Font: Plus Jakarta Sans · Icons: 1.9px stroke, 24px grid</span>
</div>
</header>

<section style="display: flex; flex-direction: column; gap: 24px">
<div class="dk-lab" style="font-size: 13px">01 · Principles</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<div class="dk-card" style="padding: 24px; display: flex; flex-direction: column; gap: 10px"><svg class="ic" width="26" height="26" style="color: var(--accent-text)"><use href="#i-timeline"></use></svg><div style="font-size: 20px; font-weight: 800">Timeline first</div><div style="font-size: 15px; line-height: 1.55; color: var(--ink-muted)">The day is the interface. Every other module feeds the timeline rather than competing with it.</div></div>
<div class="dk-card" style="padding: 24px; display: flex; flex-direction: column; gap: 10px"><svg class="ic" width="26" height="26" style="color: var(--accent-text)"><use href="#i-leaf"></use></svg><div style="font-size: 20px; font-weight: 800">Calm by default</div><div style="font-size: 15px; line-height: 1.55; color: var(--ink-muted)">Warm neutrals, one accent, hairline borders. Color is reserved for your activities, not for chrome.</div></div>
<div class="dk-card" style="padding: 24px; display: flex; flex-direction: column; gap: 10px"><svg class="ic" width="26" height="26" style="color: var(--accent-text)"><use href="#i-check"></use></svg><div style="font-size: 20px; font-weight: 800">Honest contrast</div><div style="font-size: 15px; line-height: 1.55; color: var(--ink-muted)">Every text token clears 4.5:1 on its surfaces; every activity hue carries a white icon at 3:1 or better.</div></div>
<div class="dk-card" style="padding: 24px; display: flex; flex-direction: column; gap: 10px"><svg class="ic" width="26" height="26" style="color: var(--accent-text)"><use href="#i-heart"></use></svg><div style="font-size: 20px; font-weight: 800">Made for thumbs</div><div style="font-size: 15px; line-height: 1.55; color: var(--ink-muted)">44px targets, bottom sheets, a floating tab bar and a single + that is always within reach.</div></div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><div class="dk-lab" style="font-size: 13px">02 · Semantic color</div><span style="font-size: 14px; color: var(--ink-muted)">Use the class, never the hex. Add <span style="font-weight: 700; color: var(--ink)">.dark</span> on &lt;html&gt; to flip.</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="dk dk-{{th.key}}" style="border-radius: 28px; padding: 24px; background: var(--canvas); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800"><svg class="ic" width="18" height="18"><use href="#i-{{th.icon}}"></use></svg>{{th.label}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tokens}}" as="t" hint-placeholder-count="16">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line)">
<span style="width: 40px; height: 40px; border-radius: 10px; background: var({{t.v}}); border: 1px solid var(--line-strong); flex: none"></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 700">{{t.name}}</span><span class="tnum" style="font-size: 12px; color: var(--ink-muted); font-family: ui-monospace, Menlo, monospace">{{t.cls}}</span></span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><div class="dk-lab" style="font-size: 13px">03 · Activity hues</div><span style="font-size: 14px; color: var(--ink-muted)">Nine muted hues of like lightness. Identical in both themes. White icon contrast shown.</span></div>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{hues}}" as="h" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="width: 56px; height: 112px; border-radius: 28px; background: {{h.c}}; color: #FFFFFF; display: grid; place-items: center"><svg class="ic" width="24" height="24"><use href="#i-{{h.icon}}"></use></svg></span>
<span style="font-size: 15px; font-weight: 800">{{h.name}}</span>
<span class="tnum" style="font-size: 12.5px; color: var(--ink-muted); font-family: ui-monospace, Menlo, monospace">{{h.hex}}</span>
<span class="dk-tag tnum">{{h.cr}}</span>
<span style="font-size: 12px; color: var(--ink-subtle); text-align: center; line-height: 1.4">{{h.use}}</span>
</div>
</sc-for>
</div>
</section>

<section style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 48px">
<div style="display: flex; flex-direction: column; gap: 20px">
<div class="dk-lab" style="font-size: 13px">04 · Typography</div>
<div class="dk-list" style="border-radius: 24px">
<sc-for list="{{type}}" as="t" hint-placeholder-count="8">
<div class="dk-li" style="min-height: 76px; padding: 14px 24px; gap: 24px">
<span style="width: 150px; flex: none; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700">{{t.name}}</span><span style="font-size: 12px; color: var(--ink-muted); font-family: ui-monospace, Menlo, monospace">{{t.cls}}</span></span>
<span style="flex: 1; min-width: 0; font-size: {{t.size}}px; font-weight: {{t.w}}; letter-spacing: {{t.ls}}; text-transform: {{t.tt}}; color: {{t.color}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sample}}</span>
<span class="tnum" style="font-size: 12px; color: var(--ink-subtle); white-space: nowrap">{{t.spec}}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 20px">
<div class="dk-lab" style="font-size: 13px">05 · Shape, space &amp; depth</div>
<div class="dk-card" style="padding: 24px; display: flex; flex-direction: column; gap: 22px; border-radius: 24px">
<div style="display: flex; align-items: flex-end; gap: 18px">
<sc-for list="{{radii}}" as="r" hint-placeholder-count="5"><div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 64px; height: 64px; background: var(--sunken); border: 2px solid var(--line-strong); border-radius: {{r.px}}px"></span><span style="font-size: 12.5px; font-weight: 700">{{r.name}}</span><span class="tnum" style="font-size: 12px; color: var(--ink-muted)">{{r.px}}px</span></div></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 700">Spacing · 4px base · pills use radius 999</div>
<sc-for list="{{space}}" as="s" hint-placeholder-count="7"><div style="display: flex; align-items: center; gap: 12px"><span class="tnum" style="width: 56px; font-size: 12px; color: var(--ink-muted); font-family: ui-monospace, Menlo, monospace">{{s.cls}}</span><span style="height: 10px; width: {{s.px}}px; border-radius: 3px; background: var(--accent)"></span><span class="tnum" style="font-size: 12px; color: var(--ink-subtle)">{{s.px}}px</span></div></sc-for>
</div>
<div style="display: flex; gap: 16px">
<div style="flex: 1; height: 88px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--ink-muted)">Flat · border-line</div>
<div style="flex: 1; height: 88px; border-radius: 20px; background: var(--elevated); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--ink-muted)">shadow-float</div>
<div style="flex: 1; height: 88px; border-radius: 20px; background: var(--elevated); box-shadow: 0 12px 28px rgba(0,0,0,.28); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--ink-muted)">shadow-lift</div>
</div>
<div style="font-size: 13px; color: var(--ink-muted); line-height: 1.5">Shadows only on things that float: tab bar, sheets, a capsule while it is being dragged. Everything else sits flat on a hairline.</div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><div class="dk-lab" style="font-size: 13px">06 · Components</div><span style="font-size: 14px; color: var(--ink-muted)">The same markup in both themes.</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="dk dk-{{th.key}}" style="border-radius: 28px; padding: 28px; background: var(--canvas); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800"><svg class="ic" width="18" height="18"><use href="#i-{{th.icon}}"></use></svg>{{th.label}}</div>

<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px 16px 18px 0; position: relative">
<div class="dk-lab" style="padding: 0 0 12px 20px; font-size: 11px">Timeline · done · active · upcoming</div>

<span style="position: absolute; left: 112px; top: 2px; display: flex; flex-direction: column; gap: 1px"><span class="tnum" style="font-size: 12.5px; color: var(--ink-muted)">6:55–7:30 AM (35 min)</span><span style="font-size: 16px; font-weight: 700; color: var(--ink-subtle); text-decoration: line-through">Run · 5K</span></span>

</div>
<div style="position: absolute; left: 112px; top: 226px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted)"><svg class="ic" width="15" height="15"><use href="#i-clock"></use></svg><span style="font-weight: 700; color: var(--accent-text)">30m</span> free before Design sync</div>
<div style="position: absolute; left: 0; right: 0; top: 250px; height: 78px">
<span class="tnum" style="position: absolute; left: 2px; top: 3px; width: 42px; text-align: right; font-size: 11px; font-weight: 600; color: var(--ink-muted)">12:00</span>
<span style="position: absolute; left: 52px; top: 0; width: 48px; height: 48px; border-radius: 999px; background: var(--h-sky); color: #FFFFFF; display: grid; place-items: center"><svg class="ic" width="22" height="22"><use href="#i-video"></use></svg></span>

<span class="dk-ring" style="position: absolute; right: 18px; top: 11px; border-color: var(--h-sky)"></span>

</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="dk-lab" style="font-size: 11px">Buttons</div>
<button class="dk-btn">Add to timeline</button>
<button class="dk-btn2">Another session</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="dk-lab" style="font-size: 11px">Segmented · chips</div>
<div class="dk-seg"><button aria-pressed="false">Day</button><button aria-pressed="true">Week</button><button aria-pressed="false">Month</button></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><span class="dk-chip" aria-pressed="true">Open 6</span><span class="dk-chip">Today</span><span class="dk-chip" style="background: var(--accent-soft); color: var(--accent-text)">Plan</span></div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="dk-lab" style="font-size: 11px">Habit check-in · ring · tags</div>
<div style="display: flex; gap: 14px; align-items: center">
<span style="width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: color-mix(in srgb, var(--h-sky) 14%, var(--surface)); color: var(--h-sky); border: 1.5px dashed color-mix(in srgb, var(--h-sky) 60%, var(--surface))"><svg class="ic" width="20" height="20"><use href="#i-drop"></use></svg></span>
