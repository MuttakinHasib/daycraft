.dk :where(input,textarea){font:inherit;color:var(--ink);background:transparent;border:0;outline:none;margin:0}

<button onClick="{{newTask}}" aria-label="New task" class="dk-new dk-press" style="height: 44px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 16px"><svg class="ic" width="18" height="18" style="stroke-width: 2.6"><use href="#i-plus"></use></svg><span class="dk-hide">New task</span></button>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
<sc-if value="{{n.gap}}" hint-placeholder-val="{{ false }}"><div class="dk-lab dk-hide" style="padding: 16px 12px 8px">{{n.gapLabel}}</div></sc-if>
<button class="dk-navi" aria-current="{{n.cur}}" aria-label="{{n.label}}" onClick="{{n.go}}">
<svg class="ic" width="18" height="18"><use href="#i-{{n.icon}}"></use></svg>
<span class="dk-hide" style="flex: 1">{{n.label}}</span>
<span class="tnum dk-hide" style="font-size: 12.5px; color: var(--ink-subtle)">{{n.meta}}</span>
</button>
</sc-for>
<div style="flex: 1; min-height: 24px"></div>
<div class="dk-seg" role="group" aria-label="Theme">
<sc-for list="{{themeOpts}}" as="t" hint-placeholder-count="2"><button aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px"><svg class="ic" width="15" height="15"><use href="#i-{{t.icon}}"></use></svg><span class="dk-hide">{{t.label}}</span></button></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 8px 0">
<span style="width: 32px; height: 32px; border-radius: 999px; background: var(--sunken); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: var(--accent-text)">H</span>
<span class="dk-hide" style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Hasib</span><span style="font-size: 12px; color: var(--ink-muted)">Personal workspace</span></span>
</div>
</nav>

<main class="dk-main" style="flex: 1 1 0; min-width: 0; padding: 24px 32px 32px">
<div class="dk-content" style="display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<div style="display: flex; align-items: center; gap: 4px; font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1"><span>{{hdr.monthDay}},</span><span style="color: var(--accent-text); margin-left: 6px">{{hdr.year}}</span></div>
<div style="font-size: 14px; color: var(--ink-muted); margin-top: 4px">{{hdr.sub}}</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{hdr.notToday}}" hint-placeholder-val="{{ false }}"><button class="dk-chip dk-press" onClick="{{goToday}}" style="background: var(--accent-soft); color: var(--accent-text)">Today</button></sc-if>
<button class="dk-ib" aria-label="Previous week" onClick="{{prevWeek}}"><svg class="ic" width="18" height="18"><use href="#i-chev-l"></use></svg></button>
<div style="display: flex; gap: 2px; padding: 4px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line)">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button class="dk-press" onClick="{{d.pick}}" aria-label="{{d.aria}}" style="width: 52px; height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{d.bg}}; color: {{d.fg}}; transition: background-color .2s ease">
<span style="font-size: 11px; font-weight: 600; opacity: .8">{{d.wd}}</span>
<span class="tnum" style="font-size: 16px; font-weight: 800">{{d.num}}</span>
<span style="display: flex; height: 5px"><sc-for list="{{d.dots}}" as="dot" hint-placeholder-count="2"><span style="width: 5px; height: 5px; border-radius: 3px; background: {{dot.c}}; margin: 0 1px"></span></sc-for></span>
</button>
</sc-for>
</div>
<button class="dk-ib" aria-label="Next week" onClick="{{nextWeek}}"><svg class="ic" width="18" height="18"><use href="#i-chev-r"></use></svg></button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-label="Timeline" style="flex: 999 1 460px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line)">
<span class="dk-lab" style="margin-right: 4px">Habits</span>
<div class="dk-hs" style="display: flex; gap: 8px; flex: 1; min-width: 0">
<sc-for list="{{habitStrip}}" as="h" hint-placeholder-count="5">
<button class="dk-press" onClick="{{h.toggle}}" aria-pressed="{{h.done}}" style="height: 36px; flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; border-radius: 999px; background: {{h.chipBg}}; border: 1.5px dashed {{h.border}}; font-size: 13px; font-weight: 600; transition: background-color .2s ease">
<span style="width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; background: {{h.bg}}; color: {{h.fg}}"><svg class="ic" width="14" height="14"><use href="#i-{{h.icon2}}"></use></svg></span>{{h.name}}
</button>
</sc-for>
</div>
</div>
<div class="dk-scroll" ref="{{setTl}}" style="height: 700px; position: relative; scroll-behavior: smooth">
<div style="position: relative; height: {{tl.height}}px">
<sc-for list="{{tl.slots}}" as="s" hint-placeholder-count="0">
<button class="dk-slot" onClick="{{s.add}}" aria-label="{{s.aria}}" style="position: absolute; left: 68px; right: 12px; top: {{s.top}}px; height: {{s.h}}px; border-radius: 12px; z-index: 1">
<span class="dk-hint" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent-text)"><svg class="ic" width="13" height="13"><use href="#i-plus"></use></svg>Add at {{s.label}}</span>
</button>
</sc-for>
<sc-for list="{{tl.hours}}" as="hr" hint-placeholder-count="0">
<div style="position: absolute; left: 0; right: 24px; top: {{hr.top}}px; height: 0; pointer-events: none">
<span class="tnum" style="position: absolute; left: 8px; top: -8px; width: 52px; text-align: right; font-size: 11px; font-weight: 500; color: var(--ink-subtle)">{{hr.label}}</span>
<span style="position: absolute; left: 68px; right: 0; top: 0; border-top: 1px solid var(--line)"></span>
</div>
</sc-for>
<sc-for list="{{tl.spine}}" as="sp" hint-placeholder-count="0">
<div style="position: absolute; left: 91px; width: 2px; top: {{sp.top}}px; height: {{sp.h}}px; background: {{sp.bg}}; opacity: {{sp.op}}; z-index: 2; pointer-events: none"></div>
</sc-for>
<sc-for list="{{tl.gaps}}" as="g" hint-placeholder-count="0">
<div style="position: absolute; left: 128px; right: 24px; top: {{g.top}}px; z-index: 4; display: flex; align-items: center; gap: 12px; pointer-events: none">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted); font-weight: 500"><svg class="ic" width="15" height="15"><use href="#i-clock"></use></svg><span style="font-weight: 700; color: var(--accent-text)">{{g.big}}</span>{{g.rest}}</span>
<button class="dk-chip sm dk-press" onClick="{{g.add}}" style="pointer-events: auto; color: var(--accent-text)"><svg class="ic" width="13" height="13"><use href="#i-plus"></use></svg>Add task</button>
</div>
</sc-for>
<sc-if value="{{tl.showNow}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: {{tl.nowY}}px; height: 0; z-index: 2; pointer-events: none">
<span class="tnum" style="position: absolute; left: 8px; top: -8px; width: 52px; text-align: right; font-size: 11px; font-weight: 800; color: var(--accent-text)">{{tl.nowLabel}}</span>
<span style="position: absolute; left: 68px; right: 24px; top: 0; border-top: 1.5px solid var(--accent); opacity: .5"></span>
<span style="position: absolute; left: 87px; top: -5px; width: 10px; height: 10px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 3px var(--surface)"></span>
</div>
</sc-if>
<sc-for list="{{tl.rows}}" as="r" hint-placeholder-count="6">
<div style="position: absolute; left: 0; right: 0; top: {{r.top}}px; height: {{r.rowH}}px; z-index: {{r.z}}; transition: {{r.trans}}; pointer-events: none">
<sc-if value="{{r.showGut}}" hint-placeholder-val="{{ true }}"><span class="tnum" style="position: absolute; left: 8px; top: 3px; width: 52px; text-align: right; font-size: 11px; font-weight: 600; color: var(--ink-muted)">{{r.gut}}</span></sc-if>
<sc-if value="{{r.dragging}}" hint-placeholder-val="{{ false }}"><span class="tnum" style="position: absolute; left: 128px; top: -30px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--ink); color: var(--canvas); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">{{r.dragLabel}}</span></sc-if>
<div style="position: absolute; left: 116px; right: 12px; top: -6px; height: {{r.selH}}px; border-radius: 16px; background: {{r.selBg}}; transition: background-color .2s ease"></div>
<button class="{{r.capCls}}" aria-label="{{r.capAria}}" onPointerDown="{{r.down}}" onPointerMove="{{r.move}}" onPointerUp="{{r.up}}" onPointerCancel="{{r.cancel}}" onClick="{{r.open}}" style="pointer-events: auto; position: absolute; left: 68px; top: 0; width: 48px; height: {{r.capH}}px; border-radius: 24px; background: {{r.capBg}}; opacity: {{r.capOp}}; box-shadow: {{r.capShadow}}; color: #FFFFFF; display: grid; place-items: center; overflow: hidden; touch-action: none; cursor: grab; transition: opacity .25s ease, box-shadow .2s ease">
<sc-if value="{{r.active}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; top: 0; height: {{r.elapsed}}%; background: {{r.hueC}}"></span></sc-if>
<svg class="ic" width="22" height="22" style="position: relative"><use href="#i-{{r.icon}}"></use></svg>
<sc-if value="{{r.resizable}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" onPointerDown="{{r.rdown}}" onPointerMove="{{r.move}}" onPointerUp="{{r.up}}" onPointerCancel="{{r.cancel}}" style="position: absolute; left: 0; right: 0; bottom: 0; height: 18px; display: grid; place-items: center; cursor: ns-resize; touch-action: none"><span style="width: 16px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.75)"></span></span></sc-if>
</button>
<button onClick="{{r.open}}" aria-label="{{r.openAria}}" style="pointer-events: auto; position: absolute; left: 128px; right: 60px; top: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding-top: 2px">
<span class="tnum" style="font-size: 12.5px; font-weight: 500; color: var(--ink-muted); display: flex; align-items: center; gap: 5px; white-space: nowrap">{{r.time}}<sc-if value="{{r.repeat}}" hint-placeholder-val="{{ false }}"><svg class="ic" width="12" height="12"><use href="#i-repeat"></use></svg></sc-if></span>
<span style="max-width: 100%; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: {{r.titleColor}}; text-decoration: {{r.deco}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
<sc-if value="{{r.hasMeta}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap">
<sc-if value="{{r.active}}" hint-placeholder-val="{{ false }}"><span class="dk-tag" style="background: var(--accent-soft); color: var(--accent-text)"><span style="width: 6px; height: 6px; border-radius: 999px; background: var(--accent)"></span>{{r.left}}</span></sc-if>
<sc-if value="{{r.hasSubs}}" hint-placeholder-val="{{ false }}"><span class="dk-tag tnum"><svg class="ic" width="13" height="13"><use href="#i-checksq"></use></svg>{{r.subsLabel}}</span></sc-if>
<sc-if value="{{r.isEvent}}" hint-placeholder-val="{{ false }}"><span class="dk-tag"><svg class="ic" width="12" height="12"><use href="#i-calendar"></use></svg>Event · {{r.loc}}</span></sc-if>
<sc-for list="{{r.labels}}" as="l" hint-placeholder-count="1"><span class="dk-tag"><svg class="ic" width="12" height="12"><use href="#i-tag"></use></svg>{{l.t}}</span></sc-for>
</span>
</sc-if>
</button>
<button class="dk-ring" onClick="{{r.check}}" aria-label="{{r.checkAria}}" aria-pressed="{{r.done}}" style="pointer-events: auto; position: absolute; right: 24px; top: 12px; border-color: {{r.hueC}}; background: {{r.ringBg}}; color: #FFFFFF">
<sc-if value="{{r.done}}" hint-placeholder-val="{{ false }}"><svg class="ic dk-flash" width="14" height="14" style="stroke-width: 3.2"><use href="#i-check"></use></svg></sc-if>
</button>
</div>
</sc-for>
</div>
</div>
</section>

<aside aria-label="Details" class="dk-aside" style="flex: 1 1 340px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{dt.has}}" hint-placeholder-val="{{ false }}">
<div class="dk-fade" style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden">
<div style="background: {{dt.hueC}}; color: #FFFFFF; padding: 16px 20px 24px; transition: background-color .25s ease">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(0,0,0,.16); font-size: 12px; font-weight: 700">{{dt.kind}}</span>
<button class="dk-ib sm" aria-label="Close details" onClick="{{dt.close}}" style="background: rgba(255,255,255,.2); color: #FFFFFF"><svg class="ic" width="16" height="16"><use href="#i-x"></use></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 16px">
<span style="width: 48px; height: 64px; border-radius: 24px; display: grid; place-items: center; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.55); flex: none"><svg class="ic" width="22" height="22"><use href="#i-{{dt.icon}}"></use></svg></span>
<div style="flex: 1; min-width: 0">
<div class="tnum" style="font-size: 12.5px; font-weight: 600; opacity: .9">{{dt.time}}</div>
<input class="oh" aria-label="Title" value="{{dt.title}}" onChange="{{dt.onTitle}}" style="width: 100%; font-size: 20px; font-weight: 800; color: #FFFFFF; padding: 2px 0 4px; border-bottom: 1.5px solid rgba(255,255,255,.4)">
</div>
</div>
</div>
<div style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div class="dk-field"><span style="font-size: 13px; font-weight: 700">Duration</span><div class="dk-seg" role="group" aria-label="Duration"><sc-for list="{{dt.durs}}" as="o" hint-placeholder-count="6"><button aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="dk-field"><span style="font-size: 13px; font-weight: 700">Color</span><div style="display: flex; justify-content: space-between"><sc-for list="{{dt.hues}}" as="c" hint-placeholder-count="9"><button class="dk-sw" aria-label="{{c.label}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="width: 28px; height: 28px; background: {{c.c}}"></button></sc-for></div></div>
<sc-if value="{{dt.hasSubs}}" hint-placeholder-val="{{ false }}">
<div class="dk-list">
<div class="dk-li" style="min-height: 44px; justify-content: space-between"><span style="font-size: 14px; font-weight: 700">Subtasks</span><span class="tnum" style="font-size: 12.5px; color: var(--ink-muted)">{{dt.subsLabel}}</span></div>
<sc-for list="{{dt.subs}}" as="s" hint-placeholder-count="3">
<button class="dk-li" onClick="{{s.toggle}}" aria-pressed="{{s.done}}" style="min-height: 44px">
